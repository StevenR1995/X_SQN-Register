<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALPHA Register</title>

<style>
body {
  background: #111;
  font-family: Arial, sans-serif;
  color: white;
  padding: 20px;
}

h1 {
  text-align: center;
  color: lime;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: #00ff00;
  color: black;
  font-weight: bold;
}

th, td {
  border: 2px solid black;
  padding: 8px;
  text-align: center;
}

th {
  background: #00cc00;
}

button {
  padding: 6px 10px;
  margin: 2px;
  font-weight: bold;
  cursor: pointer;
  border: 2px solid black;
  border-radius: 4px;
}

.present {
  background: #1eff1e;
}

.absent {
  background: #ff3333;
  color: white;
}

.clear {
  background: #ddd;
}

.red {
  background: #cc0000;
  color: white;
}

.amber {
  background: #ffbf00;
  color: black;
}

.green {
  background: #00b300;
  color: white;
}

#syncStatus {
  text-align: center;
  margin-bottom: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>ALPHA Register</h1>

<div id="syncStatus">Connecting...</div>

<table>
  <thead>
    <tr>
      <th>Rank</th>
      <th>Discord</th>
      <th>Callsign</th>
      <th>Role</th>
      <th>Mark</th>
      <th>Attended</th>
      <th>Total Days</th>
      <th>%</th>
    </tr>
  </thead>
  <tbody id="register"></tbody>
</table>

<!-- Firebase scripts -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* PASTE YOUR FIREBASE CONFIG HERE */
const firebaseConfig = {
  apiKey: "AIzaSyB8YIbmSBQHx2zGWlu9onNkhnT5KdMJc80",
  authDomain: "xsqn-register.firebaseapp.com",
  databaseURL: "https://xsqn-register-default-rtdb.firebaseio.com",
  projectId: "xsqn-register",
  storageBucket: "xsqn-register.firebasestorage.app",
  messagingSenderId: "505702091688",
  appId: "1:505702091688:web:cc630fd32f8d094157ab9d",
  measurementId: "G-BLD37ENTNC"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const registerRef = db.ref("milsimRegisters/alphaRegister");

const members = [
  ["Acting Corporal", "dakota_kiwi [Dakota]", "VA1", ""],
  ["Lance Corporal", "", "VA2", ""],
  ["Marine", "soap1336", "VA3", ""],
  ["Marine", "", "VA4", ""],
  ["Marine", "", "VA5", ""],
  ["Marine", "r6majesty [Steiny]", "VA6", ""],

  ["Acting Sergeant", "tiktok_smokezy120 [Smokey]", "VB1", ""],
  ["Lance Corporal", "", "VB2", ""],
  ["Marine", "", "VB3", ""],
  ["Marine", "leanchuck", "VB4", ""],
  ["Marine", "", "VB5", ""],
  ["Marine", "", "VB6", ""]
];

let data = {};

function getColourClass(percent) {
  if (percent < 75) return "red";
  if (percent < 85) return "amber";
  return "green";
}

function mark(callsign, result) {
  const current = data[callsign] || { attended: 0, total: 0 };

  if (result === "present") {
    current.attended++;
    current.total++;
  }

  if (result === "absent") {
    current.total++;
  }

  registerRef.child(callsign).set(current);
}

function clearPerson(callsign) {
  registerRef.child(callsign).set({
    attended: 0,
    total: 0
  });
}

function render() {
  const tbody = document.getElementById("register");
  tbody.innerHTML = "";

  members.forEach(member => {
    const [rank, discord, callsign, role] = member;

    const stats = data[callsign] || { attended: 0, total: 0 };

    const attended = stats.attended || 0;
    const total = stats.total || 0;
    const percentNum = total === 0 ? 0 : Math.round((attended / total) * 100);
    const percent = percentNum + "%";
    const colourClass = getColourClass(percentNum);

    tbody.innerHTML += `
      <tr>
        <td>Rank: ${rank}</td>
        <td>Discord: ${discord}</td>
        <td>Callsign: ${callsign}</td>
        <td>Role: ${role}</td>
        <td>
          <button class="present" onclick="mark('${callsign}', 'present')">Present</button>
          <button class="absent" onclick="mark('${callsign}', 'absent')">Absent</button>
          <button class="clear" onclick="clearPerson('${callsign}')">Reset</button>
        </td>
        <td>${attended}</td>
        <td>${total}</td>
        <td class="${colourClass}">${percent}</td>
      </tr>
    `;
  });
}

registerRef.on("value", snapshot => {
  data = snapshot.val() || {};
  document.getElementById("syncStatus").innerText = "Synced Online";
  render();
});

render();
</script>

</body>
</html>
