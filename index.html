function unlockEditing() {
  const input = document.getElementById("adminPass").value.trim();

  if (input === ADMIN_PASSWORD) {
    isAdmin = true;
    document.getElementById("lockStatus").innerText = "🔓 Unlocked";
    document.getElementById("adminPass").value = "";
    render();
  } else {
    document.getElementById("lockStatus").innerText = "❌ Wrong password";
  }
}

function getPageFromURL() {
  const params = new URLSearchParams(window.location.search);
  const page = params.get("page");

  if (page) {
    const clean = page.toUpperCase();
    if (["HQ","ALPHA","SFSG","AVIATION"].includes(clean)) {
      currentPage = clean;
    }
  }

  document.getElementById("pageTitle").innerText = currentPage + " Register";
}

function setPage(page) {
  currentPage = page;
  window.history.pushState({}, "", "?page=" + page.toLowerCase());
  document.getElementById("pageTitle").innerText = page + " Register";
  render();
}

function getMember(member) {
  return {
    ...member,
    ...(edits[member.id] || {})
  };
}

function getColour(percent) {
  if (percent < 75) return "red";
  if (percent < 85) return "amber";
  return "green";
}

function getRowClass(section) {
  if (section === "HQ") return "hq-row";
  if (section === "SFSG") return "sfsg-row";
  if (section === "AVIATION") return "aviation-row";
  return "alpha-row";
}

function safeText(value) {
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function safeValue(value) {
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function input(id, field, value) {
  return `<input class="editInput" id="${field}_${id}" value="${safeValue(value)}">`;
}

function saveRow(id) {
  if (!isAdmin) return;

  const updated = {
    section: document.getElementById("section_" + id).value.trim().toUpperCase(),
    rank: document.getElementById("rank_" + id).value.trim(),
    discord: document.getElementById("discord_" + id).value.trim(),
    callsign: document.getElementById("callsign_" + id).value.trim(),
    role: document.getElementById("role_" + id).value.trim()
  };

  if (!updated.section) updated.section = currentPage;

  editsRef.child(id).set(updated);
}

function mark(id, type) {
  if (!isAdmin) return;

  const current = attendance[id] || { attended:0, total:0 };

  if (type === "present") {
    current.attended++;
    current.total++;
  }

  if (type === "absent") {
    current.total++;
  }

  attendanceRef.child(id).set(current);
}

function clearPerson(id) {
  if (!isAdmin) return;

  if (confirm("Reset attendance for this row?")) {
    attendanceRef.child(id).set({
      attended:0,
      total:0
    });
  }
}

function render() {
  const tbody = document.getElementById("register");
  tbody.innerHTML = "";

  members
    .map(getMember)
    .filter(member => member.section === currentPage)
    .forEach(member => {
      const stats = attendance[member.id] || { attended:0, total:0 };
      const attended = stats.attended || 0;
      const total = stats.total || 0;
      const percent = total === 0 ? 0 : Math.round((attended / total) * 100);

      tbody.innerHTML += `
        <tr class="${getRowClass(member.section)}">
          <td>${isAdmin ? input(member.id,"section",member.section) : safeText(member.section)}</td>
          <td>${isAdmin ? input(member.id,"rank",member.rank) : safeText(member.rank)}</td>
          <td>${isAdmin ? input(member.id,"discord",member.discord) : safeText(member.discord)}</td>
          <td>${isAdmin ? input(member.id,"callsign",member.callsign) : safeText(member.callsign)}</td>
          <td>${isAdmin ? input(member.id,"role",member.role) : safeText(member.role)}</td>

          <td>
            ${
              isAdmin
              ? `
                <button class="present" onclick="mark('${member.id}','present')">Present</button>
                <button class="absent" onclick="mark('${member.id}','absent')">Absent</button>
                <button class="clear" onclick="clearPerson('${member.id}')">Reset</button>
              `
              : "🔒 Locked"
            }
          </td>

          <td>${attended}</td>
          <td>${total}</td>
          <td class="${getColour(percent)}">${percent}%</td>

          <td>
            ${
              isAdmin
              ? `<button class="save" onclick="saveRow('${member.id}')">Save Row</button>`
              : "🔒"
            }
          </td>
        </tr>
      `;
    });
}

getPageFromURL();

attendanceRef.on("value", function(snapshot) {
  attendance = snapshot.val() || {};
  document.getElementById("syncStatus").innerText = "Synced Online";
  render();
});

editsRef.on("value", function(snapshot) {
  edits = snapshot.val() || {};
  render();
});

render();
</script>
