<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SBS X SQN Register</title>

<style>
body {
  background: #111;
  font-family: Arial, sans-serif;
  color: white;
  padding: 20px;
}

h1 {
  text-align: center;
  color: lime;
}

#syncStatus {
  text-align: center;
  margin-bottom: 15px;
  font-weight: bold;
}

.pageButtons {
  text-align: center;
  margin-bottom: 15px;
}

.pageButtons button {
  font-size: 18px;
  padding: 10px 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
  color: black;
  font-weight: bold;
}

th, td {
  border: 2px solid black;
  padding: 8px;
  text-align: center;
}

th {
  background: #00cc00;
}

tr.hq-row {
  background: #ff0000;
}

tr.alpha-row {
  background: #00ff00;
}

tr.sfsg-row {
  background: #55aa44;
}

button {
  padding: 6px 10px;
  margin: 2px;
  font-weight: bold;
  cursor: pointer;
  border: 2px solid black;
  border-radius: 4px;
}

.present {
  background: #1eff1e;
}

.absent {
  background: #ff3333;
  color: white;
}

.clear {
  background: #ddd;
}

.red {
  background: #cc0000;
  color: white;
}

.amber {
  background: #ffbf00;
  color: black;
}

.green {
  background: #00b300;
  color: white;
}
</style>
</head>

<body>

<h1 id="pageTitle">ALPHA Register</h1>

<div id="syncStatus">Connecting...</div>

<div class="pageButtons">
  <button onclick="setPage('HQ')">HQ</button>
  <button onclick="setPage('ALPHA')">ALPHA</button>
  <button onclick="setPage('SFSG')">SFSG</button>
</div>

<table>
  <thead>
    <tr>
      <th>Section</th>
      <th>Rank</th>
      <th>Discord</th>
      <th>Callsign</th>
      <th>Role</th>
      <th>Mark</th>
      <th>Attended</th>
      <th>Total Days</th>
      <th>%</th>
    </tr>
  </thead>
  <tbody id="register"></tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB8YIbmSBQHx2zGWlu9onNkhnT5KdMJc80",
  authDomain: "xsqn-register.firebaseapp.com",
  databaseURL: "https://xsqn-register-default-rtdb.firebaseio.com",
  projectId: "xsqn-register",
  storageBucket: "xsqn-register.firebasestorage.app",
  messagingSenderId: "505702091688",
  appId: "1:505702091688:web:cc630fd32f8d094157ab9d",
  measurementId: "G-BLD37ENTNC"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const registerRef = db.ref("milsimRegisters/sbsXSqnRegister");

let currentPage = "ALPHA";

function getPageFromURL() {
  const params = new URLSearchParams(window.location.search);
  const page = params.get("page");

  if (page) {
    const cleanPage = page.toUpperCase();

    if (cleanPage === "HQ" || cleanPage === "ALPHA" || cleanPage === "SFSG") {
      currentPage = cleanPage;
    }
  }

  document.getElementById("pageTitle").innerText = currentPage + " Register";
}

const members = [
  ["HQ", "LT COL", "Asdabag300 [ASDA]", "V11", ""],
  ["HQ", "Major", "Stevenr1995 [Steven]", "V12", ""],
  ["HQ", "Lieutenant", "beanbo_bagins [Bagins]", "VS1", ""],
  ["HQ", "2 Lieutenant", "bumjellybill [Jimmy]", "VM1", "EOD"],
  ["HQ", "Warrent Officer 1", "septinox [Saber]", "VR2", "Lead Medic"],

  ["ALPHA", "Acting Corporal", "dakota_kiwi [Dakota]", "VA1", ""],
  ["ALPHA", "Lance Corporal", "", "VA2", ""],
  ["ALPHA", "Marine", "soap1336", "VA3", ""],
  ["ALPHA", "Marine", "", "VA4", ""],
  ["ALPHA", "Marine", "", "VA5", ""],
  ["ALPHA", "Marine", "r6majesty [Steiny]", "VA6", ""],
  ["ALPHA", "Acting Sergeant", "tiktok_smokezy120 [Smokey]", "VB1", ""],
  ["ALPHA", "Lance Corporal", "mrbeanz3261 [Harry]", "VB2", ""],
  ["ALPHA", "Marine", "turbine98 [Turbine]", "VB3", ""],
  ["ALPHA", "Marine", "leanchuck", "VB4", ""],
  ["ALPHA", "Marine", "", "VB5", ""],
  ["ALPHA", "Marine", "", "VB6", ""],

  ["ALPHA", "", "", "VA7", ""],
  ["ALPHA", "", "", "VA8", ""],
  ["ALPHA", "", "", "VA9", ""],
  ["ALPHA", "", "", "VA10", ""],
  ["ALPHA", "", "", "VA11", ""],
  ["ALPHA", "", "", "VA12", ""],
  ["ALPHA", "", "", "VA13", ""],
  ["ALPHA", "", "", "VA14", ""],
  ["ALPHA", "", "", "VA15", ""],
  ["ALPHA", "", "", "VA16", ""],

  ["SFSG", "Marine", "dale099472 [Medix]", "C1", "UNWHITELISTED"],
  ["SFSG", "Marine", "specs2378. [Specs]", "C2", ""],
  ["SFSG", "Marine", "devilz0054 [Devils]", "C3", "UNWHITELISTED"],
  ["SFSG", "Marine", "hifx4 [Fox]", "C4", "UNWHITELISTED"],
  ["SFSG", "Marine", "goose0141 [Goose]", "C5", "UNWHITELISTED"],
  ["SFSG", "Marine", "Misanthropy [Yager]", "C6", "UNWHITELISTED"],

  ["SFSG", "", "", "C7", ""],
  ["SFSG", "", "", "C8", ""],
  ["SFSG", "", "", "C9", ""],
  ["SFSG", "", "", "C10", ""],
  ["SFSG", "", "", "C11", ""]
];

let data = {};

function setPage(page) {
  currentPage = page;

  const newUrl = window.location.pathname + "?page=" + page.toLowerCase();
  window.history.pushState({}, "", newUrl);

  document.getElementById("pageTitle").innerText = page + " Register";

  render();
}

function getColourClass(percent) {
  if (percent < 75) return "red";
  if (percent < 85) return "amber";
  return "green";
}

function getRowClass(section) {
  if (section === "HQ") return "hq-row";
  if (section === "SFSG") return "sfsg-row";
  return "alpha-row";
}

function mark(callsign, result) {
  const current = data[callsign] || { attended: 0, total: 0 };

  if (result === "present") {
    current.attended++;
    current.total++;
  }

  if (result === "absent") {
    current.total++;
  }

  registerRef.child(callsign).set(current);
}

function clearPerson(callsign) {
  registerRef.child(callsign).set({
    attended: 0,
    total: 0
  });
}

function render() {
  const tbody = document.getElementById("register");
  tbody.innerHTML = "";

  members
    .filter(member => member[0] === currentPage)
    .forEach(member => {
      const [section, rank, discord, callsign, role] = member;

      const stats = data[callsign] || { attended: 0, total: 0 };

      const attended = stats.attended || 0;
      const total = stats.total || 0;
      const percentNum = total === 0 ? 0 : Math.round((attended / total) * 100);
      const colourClass = getColourClass(percentNum);
      const rowClass = getRowClass(section);

      tbody.innerHTML += `
        <tr class="${rowClass}">
          <td>${section}</td>
          <td>Rank: ${rank}</td>
          <td>Discord: ${discord}</td>
          <td>Callsign: ${callsign}</td>
          <td>Role: ${role}</td>
          <td>
            <button class="present" onclick="mark('${callsign}', 'present')">Present</button>
            <button class="absent" onclick="mark('${callsign}', 'absent')">Absent</button>
            <button class="clear" onclick="clearPerson('${callsign}')">Reset</button>
          </td>
          <td>${attended}</td>
          <td>${total}</td>
          <td class="${colourClass}">${percentNum}%</td>
        </tr>
      `;
    });
}

getPageFromURL();

registerRef.on("value", snapshot => {
  data = snapshot.val() || {};
  document.getElementById("syncStatus").innerText = "Synced Online";
  render();
});

render();
</script>

</body>
</html>
