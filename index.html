<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SBS X SQN Register</title>

<style>
body {
  background: #111;
  font-family: Arial, sans-serif;
  color: white;
  padding: 20px;
}

h1 {
  text-align: center;
  color: lime;
}

#syncStatus, .adminBox, .pageButtons {
  text-align: center;
  margin-bottom: 12px;
  font-weight: bold;
}

button {
  padding: 8px 12px;
  margin: 2px;
  font-weight: bold;
  cursor: pointer;
  border: 2px solid black;
  border-radius: 4px;
}

input {
  padding: 8px;
  font-weight: bold;
  border: 2px solid black;
  border-radius: 4px;
}

.present { background: #1eff1e; }
.absent { background: #ff3333; color: white; }
.clear { background: #ddd; }

.red { background: #cc0000; color: white; }
.amber { background: #ffbf00; color: black; }
.green { background: #00b300; color: white; }

table {
  width: 100%;
  border-collapse: collapse;
  color: black;
  font-weight: bold;
}

th, td {
  border: 2px solid black;
  padding: 8px;
  text-align: center;
}

th { background: #00cc00; }

.hq-row { background: #ff4d4d; }
.alpha-row { background: #00ff00; }
.sfsg-row { background: #66cc66; }
</style>
</head>

<body>

<h1 id="pageTitle">ALPHA Register</h1>

<div id="syncStatus">Connecting...</div>

<div class="adminBox">
  <input id="adminPass" type="password" placeholder="Enter password">
  <button type="button" onclick="unlockEditing()">Unlock Editing</button>
  <span id="lockStatus">🔒 Locked</span>
</div>

<div class="pageButtons">
  <button type="button" onclick="setPage('HQ')">HQ</button>
  <button type="button" onclick="setPage('ALPHA')">ALPHA</button>
  <button type="button" onclick="setPage('SFSG')">SFSG</button>
</div>

<table>
<thead>
<tr>
  <th>Section</th>
  <th>Rank</th>
  <th>Discord</th>
  <th>Callsign</th>
  <th>Role</th>
  <th>Mark</th>
  <th>Attended</th>
  <th>Total</th>
  <th>%</th>
</tr>
</thead>
<tbody id="register"></tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB8YIbmSBQHx2zGWlu9onNkhnT5KdMJc80",
  authDomain: "xsqn-register.firebaseapp.com",
  databaseURL: "https://xsqn-register-default-rtdb.firebaseio.com",
  projectId: "xsqn-register",
  storageBucket: "xsqn-register.firebasestorage.app",
  messagingSenderId: "505702091688",
  appId: "1:505702091688:web:cc630fd32f8d094157ab9d",
  measurementId: "G-BLD37ENTNC"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const registerRef = db.ref("milsimRegisters/sbsXSqnRegister");

let data = {};
let currentPage = "ALPHA";
let isAdmin = false;

const ADMIN_PASSWORD = "TANGOPAPA1155";

const members = [
  ["HQ","LT COL","Asdabag300 [ASDA]","V11",""],
  ["HQ","Major","Stevenr1995 [Steven]","V12",""],
  ["HQ","Lieutenant","beanbo_bagins [Bagins]","VS1",""],
  ["HQ","2 Lieutenant","bumjellybill [Jimmy]","VM1","EOD"],
  ["HQ","Warrent Officer 1","septinox [Saber]","VR2","Lead Medic"],

  ["ALPHA","Acting Corporal","dakota_kiwi [Dakota]","VA1",""],
  ["ALPHA","Lance Corporal","","VA2",""],
  ["ALPHA","Marine","soap1336 [Shampoo]","VA3",""],
  ["ALPHA","Marine","","VA4",""],
  ["ALPHA","Marine","","VA5",""],
  ["ALPHA","Marine","r6majesty [Steiny]","VA6",""],
  ["ALPHA","Acting Sergeant","tiktok_smokezy120 [Smokey]","VB1",""],
  ["ALPHA","Lance Corporal","","VB2",""],
  ["ALPHA","Marine","","VB3",""],
  ["ALPHA","Marine","leanchuck [Chuck]","VB4",""],
  ["ALPHA","Marine","","VB5",""],
  ["ALPHA","Marine","statue4646 [Statue]","VB6",""],

  ["ALPHA","","","VA7",""],
  ["ALPHA","","","VA8",""],
  ["ALPHA","","","VA9",""],
  ["ALPHA","","","VA10",""],
  ["ALPHA","","","VA11",""],
  ["ALPHA","","","VA12",""],
  ["ALPHA","","","VA13",""],
  ["ALPHA","","","VA14",""],
  ["ALPHA","","","VA15",""],
  ["ALPHA","","","VA16",""],

  ["SFSG","Marine","dale099472 [Medix]","C1","UNWHITELISTED"],
  ["SFSG","Marine","specs2378. [Specs]","C2",""],
  ["SFSG","Marine","devilz0054 [Devils]","C3","UNWHITELISTED"],
  ["SFSG","Marine","hifx4 [Fox]","C4","UNWHITELISTED"],
  ["SFSG","Marine","goose0141 [Goose]","C5","UNWHITELISTED"],
  ["SFSG","Marine","Misanthropy [Yager]","C6","UNWHITELISTED"],

  ["SFSG","","","C7",""],
  ["SFSG","","","C8",""],
  ["SFSG","","","C9",""],
  ["SFSG","","","C10",""],
  ["SFSG","","","C11",""]
];

function unlockEditing() {
  const input = document.getElementById("adminPass").value.trim();

  if (input === ADMIN_PASSWORD) {
    isAdmin = true;
    document.getElementById("lockStatus").innerText = "🔓 Unlocked";
    document.getElementById("adminPass").value = "";
    render();
  } else {
    document.getElementById("lockStatus").innerText = "❌ Wrong password";
  }
}

function getPageFromURL() {
  const params = new URLSearchParams(window.location.search);
  const page = params.get("page");

  if (page) {
    const cleanPage = page.toUpperCase();

    if (cleanPage === "HQ" || cleanPage === "ALPHA" || cleanPage === "SFSG") {
      currentPage = cleanPage;
    }
  }

  document.getElementById("pageTitle").innerText = currentPage + " Register";
}

function setPage(page) {
  currentPage = page;
  window.history.pushState({}, "", "?page=" + page.toLowerCase());
  document.getElementById("pageTitle").innerText = page + " Register";
  render();
}

function getColour(percent) {
  if (percent < 75) return "red";
  if (percent < 85) return "amber";
  return "green";
}

function getRowClass(section) {
  if (section === "HQ") return "hq-row";
  if (section === "SFSG") return "sfsg-row";
  return "alpha-row";
}

function mark(callsign, type) {
  if (!isAdmin) return;

  const current = data[callsign] || { attended: 0, total: 0 };

  if (type === "present") {
    current.attended++;
    current.total++;
  }

  if (type === "absent") {
    current.total++;
  }

  registerRef.child(callsign).set(current);
}

function clearPerson(callsign) {
  if (!isAdmin) return;

  const confirmReset = confirm("Reset attendance for " + callsign + "?");

  if (confirmReset) {
    registerRef.child(callsign).set({
      attended: 0,
      total: 0
    });
  }
}

function render() {
  const tbody = document.getElementById("register");
  tbody.innerHTML = "";

  members
    .filter(member => member[0] === currentPage)
    .forEach(member => {
      const section = member[0];
      const rank = member[1];
      const discord = member[2];
      const callsign = member[3];
      const role = member[4];

      const stats = data[callsign] || { attended: 0, total: 0 };
      const attended = stats.attended || 0;
      const total = stats.total || 0;
      const percent = total === 0 ? 0 : Math.round((attended / total) * 100);

      tbody.innerHTML += `
        <tr class="${getRowClass(section)}">
          <td>${section}</td>
          <td>${rank}</td>
          <td>${discord}</td>
          <td>${callsign}</td>
          <td>${role}</td>
          <td>
            ${
              isAdmin
              ? `
                <button class="present" type="button" onclick="mark('${callsign}', 'present')">Present</button>
                <button class="absent" type="button" onclick="mark('${callsign}', 'absent')">Absent</button>
                <button class="clear" type="button" onclick="clearPerson('${callsign}')">Reset</button>
              `
              : "🔒 Locked"
            }
          </td>
          <td>${attended}</td>
          <td>${total}</td>
          <td class="${getColour(percent)}">${percent}%</td>
        </tr>
      `;
    });
}

getPageFromURL();

registerRef.on("value", function(snapshot) {
  data = snapshot.val() || {};
  document.getElementById("syncStatus").innerText = "Synced Online";
  render();
});

render();
</script>

</body>
</html>
